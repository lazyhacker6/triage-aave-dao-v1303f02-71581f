name: Test

on:
  pull_request:

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Build attacker-controlled content artifact
        run: |
          mkdir -p out
          printf '%s\n' "${{ github.event.pull_request.number }}" > out/pr_number.txt
          echo "benign report" > out/report.txt
          printf 'payload\n' > 'out/$(id).txt'
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: content
          path: out
